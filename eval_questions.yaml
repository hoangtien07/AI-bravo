    expect_keywords: ["ký tự đặc biệt", "duy nhất", "độ rộng"]
    chapter: "Các quy tắc cơ bản"
    source_hint: "Các quy tắc cơ bản > Quy tắc đặt mã"
    source_url: "https://help.bravo.com.vn/detail/6b10ba12-50ef-492d-a492-c43deb476350?version=R1&lang=vi"
    note: "[CẦN MENTOR DUYỆT]"

