# Bộ câu hỏi đánh giá — bám corpus HELP BRAVO 10 đã crawl (data/raw/bravo10_help.jsonl).
#   expect: answer  -> kỳ vọng trả lời được (có nguồn) + chứa đủ expect_keywords (kiểm nội dung)
#   expect: refuse  -> câu BẪY/ngoài tài liệu/PII, kỳ vọng TỪ CHỐI hoặc bị chặn (chống bịa)
#
# ⚠️ MỌI câu gắn note "[CẦN MENTOR DUYỆT]": người soạn đang học ERP; expect_keywords trích từ
#    nội dung trang nguồn nhưng cần kỹ sư BRAVO xác nhận trước khi dùng chính thức.
# expect_keywords dùng cho eval.py: tỷ lệ keyword xuất hiện trong câu trả lời >= --kw (mặc định 0.5).

questions:
  # ===== ANSWER (corpus có đáp án) =====

